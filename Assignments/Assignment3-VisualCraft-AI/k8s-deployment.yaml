apiVersion: apps/v1
kind: Deployment
metadata:
  name: visualcraft-ai
  labels:
    app: visualcraft-ai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: visualcraft-ai
  template:
    metadata:
      labels:
        app: visualcraft-ai
    spec:
      containers:
      - name: visualcraft-ai
        image: visualcraft-ai:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: visualcraft-ai-service
spec:
  type: NodePort
  selector:
    app: visualcraft-ai
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
    nodePort: 30030
