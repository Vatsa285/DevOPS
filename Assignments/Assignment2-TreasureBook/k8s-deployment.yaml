apiVersion: apps/v1
kind: Deployment
metadata:
  name: treasurebook
  labels:
    app: treasurebook
spec:
  replicas: 3
  selector:
    matchLabels:
      app: treasurebook
  template:
    metadata:
      labels:
        app: treasurebook
    spec:
      containers:
      - name: treasurebook
        image: treasurebook:1.0
        imagePullPolicy: Never
        ports:
        - containerPort: 5000
        env:
        - name: ENV
          value: "production"
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: treasurebook-service
spec:
  type: NodePort
  selector:
    app: treasurebook
  ports:
  - protocol: TCP
    port: 5000
    targetPort: 5000
    nodePort: 30020
